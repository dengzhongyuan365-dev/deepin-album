name: dy_suite
app: deepin-album
module: dy
setup:
- action: session_start
  command: deepin-album /usr/share/wallpapers/deepin/Colorful-Abstraction03.jpg
  wait: 3.0
suites:
- id: suite_dy_001_s1
  name: '[021][acp1][smoke]打印预览-图片右键唤起打印'
  description: ''
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: ImageViewer
  - step_type: action
    action: element_action
    selector:
      name: Print
    do: click
  assert_steps:
