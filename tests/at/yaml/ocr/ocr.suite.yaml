name: ocr_suite
app: deepin-album
module: ocr
setup:
- action: session_start
  command: deepin-album /usr/share/wallpapers/deepin/Colorful-Abstraction03.jpg
  wait: 3.0
suites:
- id: suite_ocr_001_s1
  name: OCR-入口检查-窗口下点击工具栏按钮
  description: ''
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: ImageViewer
  - step_type: action
    action: element_action
    selector:
      name: ExtractText
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ExtractText
teardown:
- action: session_stop
