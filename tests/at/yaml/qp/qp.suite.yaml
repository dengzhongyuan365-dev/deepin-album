name: qp_suite
app: deepin-album
module: qp
setup:
- action: session_start
  command: deepin-album tests/at/assets/test_image.jpg
  wait: 3.0
suites:
- id: suite_qp_001_s1
  name: 全屏-双击图片全屏
  description: ''
  steps:
  - step_type: action
    action: mouse_double_click
    selector:
      name: ImageViewer
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
- id: suite_qp_002_s1
  name: '[046][smoke][acp1]全屏-快捷键退出全屏'
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
- id: suite_qp_003_s1
  name: 全屏-右键菜单退出全屏
  description: ''
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: ImageViewer
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
teardown:
- action: session_stop
