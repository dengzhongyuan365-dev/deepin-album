name: tpgs_suite
app: deepin-album
module: tpgs
setup:
- action: session_start
  command: deepin-album
  wait: 3.0
suites:
- id: suite_tpgs_001_s1
  name: '[core]图片格式-右键菜单检查'
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+A
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
- id: suite_tpgs_002_s1
  name: '[071][smoke][acp1]图片格式-支持旋转格式图片检查(仅bmp格式实现自动化)'
  description: ''
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: ImageViewer
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RotateButton
- id: suite_tpgs_003_s1
  name: '[296][smoke][acp1]图片格式-支持设置壁纸格式图片检查'
  description: ''
  steps: []
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SetAsWallpaper
teardown:
- action: session_stop
